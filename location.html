<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Location — Balance</title>
  <meta name="description" content="Balance — Technology, Sustainability, Investment, Creativity.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@100..900&display=swap"
    rel="stylesheet">
  <link rel="preload" as="image" href="assets/img/map-loc.webp">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="is-loading" data-page="location">

  <!-- Preloader -->
  <div class="loader" aria-hidden="true">
    <div class="loader__mark"><img src="assets/img/balance-wordmark.png" alt=""></div>
    <!-- <div class="loader__bar"><span></span></div>
    <div class="loader__count"><span class="loader__num">0</span>%</div> -->
  </div>

  <!-- Cursor -->
  <div class="cursor" aria-hidden="true">
    <div class="cursor__dot"></div>
    <div class="cursor__ring"><span class="cursor__label">Drag</span></div>
  </div>

  <!-- Header -->
  <header class="header">
    <a href="index.html" class="header__logo" data-link aria-label="Balance — home">
      <img src="assets/img/balance-wordmark.png" alt="Balance" width="141" height="30">
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="index.html" class="nav__link" data-link><span data-text="Home">Home</span></a>
      <a href="projects.html" class="nav__link" data-link><span data-text="Our Projects">Our Projects</span></a>
      <a href="location.html" class="nav__link is-active" aria-current="page" data-link><span
          data-text="Our Locations">Our Locations</span></a>
    </nav>
    <button class="burger" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button>
  </header>

  <!-- Mobile menu -->
  <div class="menu" aria-hidden="true">
    <a href="index.html" data-link>Home</a>
    <a href="projects.html" data-link>Our Projects</a>
    <a href="location.html" data-link>Our Locations</a>
  </div>

  <div id="smooth-wrapper">
    <div id="smooth-content">
      <main>
        <section class="loc" aria-label="Location">
          <div class="loc__stage">
            <div class="loc__scene">
              <div class="loc__camera">
                <div class="loc__map">
                  <img class="loc__map-img" src="assets/img/map-loc.webp" decoding="async"
                    alt="Map of Riyadh with Balance projects" width="1823" height="863">
                  <div class="loc__anchors" aria-hidden="true">
                    <!-- landmark + project anchors are added from js/projects-data.js -->
                  </div>
                </div>
              </div>
            </div>
            <div class="loc__fog" aria-hidden="true">
              <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span><span
                class="cloud c4"></span>
              <span class="cloud c5"></span><span class="cloud c6"></span><span class="cloud c7"></span>
            </div>
            <div class="loc__vignette" aria-hidden="true"></div>
            <div class="loc__pins"><!-- landmark + project pins are added from js/projects-data.js -->
            </div>
            <h1 class="loc__title">Location</h1>
            <a class="loc__arrow" href="#explore" aria-label="Scroll down">
              <span class="loc__arrow-btn" aria-hidden="true"><svg viewBox="0 0 10 15" width="10" height="15">
                  <path d="M5 0v13.5M1 9.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.2" />
                </svg></span>
              <span class="loc__arrow-text">Scroll down</span>
            </a>
            <div class="loc__noise" aria-hidden="true"></div>
          </div>
          <span class="loc__explore" id="explore" aria-hidden="true"></span>
          <nav class="loc__crumbs" aria-label="Breadcrumb">
            <ol>
              <li><a href="index.html">Home</a><span class="loc__crumbs-div" aria-hidden="true">/</span></li>
              <li aria-current="page">Location</li>
            </ol>
          </nav>
        </section>
      </main>
    </div>
  </div>

  <!-- pin side panels -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollSmoother.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
  <script src="js/projects-data.js"></script>
  <script src="js/projects-data.ar.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
